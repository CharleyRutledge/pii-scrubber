[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-scrubber"
version = "0.1.0"
description = "Scrub personally identifiable information from documents using regex rules and spaCy NER."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Charley Rutledge" }]
dependencies = [
    "spacy>=3.7,<4.0",
    "click>=8.0",
]

[project.scripts]
pii-scrubber = "pii_scrubber.cli:main"

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
docx = ["python-docx>=1.1"]
ocr = ["pytesseract>=0.3", "Pillow>=10.0"]
all = ["pymupdf>=1.24", "python-docx>=1.1", "pytesseract>=0.3", "Pillow>=10.0"]
dev = ["pytest>=7.4", "pymupdf>=1.24", "python-docx>=1.1", "pytesseract>=0.3", "Pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
