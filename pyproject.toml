[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-scrubber"
version = "0.1.0"
description = "Scrub personally identifiable information from documents using regex rules and spaCy NER."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Charley Rutledge" }]
dependencies = [
    "spacy>=3.7,<4.0",
    "click>=8.0",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]
docx = ["python-docx>=1.1"]
all = ["pdfplumber>=0.10", "python-docx>=1.1"]
dev = ["pytest>=7.4", "pdfplumber>=0.10", "python-docx>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
